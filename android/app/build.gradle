plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def readEnvironment = { String fileName ->
    def environmentFile = rootProject.file("../${fileName}")
    if (!environmentFile.isFile()) {
        throw new GradleException("Missing environment file: ${environmentFile}")
    }

    def values = [:]
    environmentFile.eachLine("UTF-8") { line ->
        def entry = line.trim()
        if (entry && !entry.startsWith("#")) {
            def separator = entry.indexOf("=")
            if (separator <= 0) {
                throw new GradleException("Invalid entry in ${fileName}: ${entry}")
            }

            def key = entry.substring(0, separator).trim()
            def value = entry.substring(separator + 1).trim()
            if (value.length() >= 2 &&
                    ((value.startsWith('"') && value.endsWith('"')) ||
                    (value.startsWith("'") && value.endsWith("'")))) {
                value = value.substring(1, value.length() - 1)
            }
            values[key] = value
        }
    }

    ["APP_ID", "APP_NAME", "APP_SUFFIX_ID"].each { key ->
        if (!values.containsKey(key)) {
            throw new GradleException("Missing ${key} in ${fileName}")
        }
    }
    values
}

def gradleString = { String value ->
    "\"${value.replace("\\", "\\\\").replace("\"", "\\\"")}\""
}

def stagingEnvironment = readEnvironment(".env.staging")
def productionEnvironment = readEnvironment(".env.production")
if (stagingEnvironment.APP_ID != productionEnvironment.APP_ID) {
    throw new GradleException("Staging and production must use the same Android namespace")
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace stagingEnvironment.APP_ID
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    lint {
        checkReleaseBuilds false
        disable += "InvalidPackage"
    }

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId stagingEnvironment.APP_ID
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true

        resValue "string", "build_config_package", stagingEnvironment.APP_ID
    }

    buildTypes {
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            matchingFallbacks = ["release", "debug"]
            debuggable true
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            matchingFallbacks = ["release", "debug"]
            debuggable false
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storePassword keystoreProperties['storePassword']
            storeFile file('release-keystore.jks')
        }
    }

    flavorDimensions += "andin_project"
    productFlavors {
        def developmentSigningVariable = signingConfigs.debug

        staging {
            signingConfig developmentSigningVariable
            dimension "andin_project"
            applicationIdSuffix stagingEnvironment.APP_SUFFIX_ID
            buildConfigField "String", "APP_NAME", gradleString(stagingEnvironment.APP_NAME)
            buildConfigField "String", "APP_FLAVOR", gradleString("staging")
            resValue "string", "application_id", stagingEnvironment.APP_ID + stagingEnvironment.APP_SUFFIX_ID
            manifestPlaceholders = [
                    appName: stagingEnvironment.APP_NAME,
            ]
        }

        production {
            signingConfig signingConfigs.release
            dimension "andin_project"
            buildConfigField "String", "APP_NAME", gradleString(productionEnvironment.APP_NAME)
            buildConfigField "String", "APP_FLAVOR", gradleString("production")
            resValue "string", "application_id", productionEnvironment.APP_ID + productionEnvironment.APP_SUFFIX_ID
            manifestPlaceholders = [
                    appName: productionEnvironment.APP_NAME,
            ]
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'com.android.support:multidex:1.0.3'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.work:work-runtime-ktx:2.7.1'
}
