name: andin_project
description: Interactive learning for difabel.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: none # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  another_flushbar: ^2.2.4
  build_runner: ^2.4.8
  change_app_package_name: ^1.1.0

  # Cupertino Icons
  cupertino_icons: ^1.0.8
  device_info_plus: ^10.1.0
  expandable: ^5.0.1
  faker: ^2.1.0
  flutter_config: ^2.0.2
  flutter_html: ^3.0.0-beta.2
  flutter_loggy: ^2.0.2
  flutter_native_splash: ^2.4.4
  flutter_sound: ^9.2.13
  flutter_svg: ^2.0.17
  get: ^4.6.6
  get_storage: ^2.1.1
  google_fonts: ^6.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hive_generator: ^2.0.1
  html: ^0.15.4
  image_picker: ^1.1.2
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  persistent_bottom_nav_bar_v2: ^5.0.2
  platform: ^3.1.6
  pull_to_refresh: ^2.0.0
  velocity_x: ^4.1.1
  very_good_analysis: ^5.1.0
  toggle_switch: ^2.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.2
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/audio/

flutter_config:
  path: ../

flutter_icons:
  android: launcher_icon
  image_path: assets/images/ic_icon.png
  ios: true
  remove_alpha_ios: true

get_cli:
  sub_folder: false